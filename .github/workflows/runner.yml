name: Run action (E2E tests)

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  default-inputs:
    name: Defaults
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kubernetes: [v1.35.2,v1.34.5,v1.33.9,v1.32.13,v1.31.14]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@master
      - name: Test Action
        uses: ./
        with:
          minikube version: v1.38.1
          kubernetes version: ${{ matrix.kubernetes }}
          github token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate Minikube
        run: minikube status | grep Running
      - name: Validate Cluster
        run: kubectl get nodes
      - name: Validate default driver
        run: 'cat $MINIKUBE_HOME/.minikube/machines/minikube/config.json | jq ".DriverName" | grep none'
  docker-driver:
    name: Docker driver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@master
      - name: Test Action
        uses: ./
        with:
          minikube version: v1.38.1
          kubernetes version: v1.35.2
          github token: ${{ secrets.GITHUB_TOKEN }}
          driver: docker
      - name: Validate Minikube
        run: minikube status | grep Running
      - name: Validate Cluster
        run: kubectl get nodes
      - name: Validate Docker driver
        run: 'cat $MINIKUBE_HOME/.minikube/machines/minikube/config.json | jq ".DriverName" | grep docker'
      - name: Validate ssh access
        run: minikube ssh --native-ssh=false "cat /etc/os-release"
  extra-args:
    name: Extra arguments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@master
      - name: Test Action
        uses: ./
        with:
          minikube version: v1.38.1
          kubernetes version: v1.34.5
          github token: ${{ secrets.GITHUB_TOKEN }}
          start args: '--addons=registry --addons=metrics-server'
      - name: Validate Minikube
        run: minikube status | grep Running
      - name: Validate Cluster
        run: kubectl get nodes
      - name: Validate enabled addon in arg
        run: minikube addons list -o json | jq '.registry.Status' | grep enabled
  ingress:
    name: Ingress enabled
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@master
      - name: Test Action
        uses: ./
        with:
          minikube version: v1.38.1
          kubernetes version: v1.35.2
          github token: ${{ secrets.GITHUB_TOKEN }}
          start args: '--addons=ingress'
      - name: Validate Minikube
        run: minikube status | grep Running
      - name: Validate Cluster
        run: kubectl get nodes
      - name: Validate enabled addon in arg
        run: minikube addons list -o json | jq '.ingress.Status' | grep enabled
  container-runtime:
    name: Container runtime config in docker driver (Required by containerd)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kubernetes: [v1.35.2,v1.34.5,v1.33.9,v1.32.13,v1.31.14,v1.26.15]
        container_runtime: ['containerd']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@master
      - name: Test Action
        uses: ./
        with:
          minikube version: v1.38.1
          kubernetes version: ${{ matrix.kubernetes }}
          github token: ${{ secrets.GITHUB_TOKEN }}
          container runtime: ${{ matrix.container_runtime }}
          driver: docker
      - name: Validate Minikube
        run: minikube status | grep Running
      - name: Validate Cluster
        run: kubectl get nodes
      - name: Validate container runtime (${{ matrix.container_runtime }})
        run: 'cat $MINIKUBE_HOME/.minikube/machines/minikube/config.json | jq ".Driver.NodeConfig.ContainerRuntime" | grep "${{ matrix.container_runtime }}"'
  unsupported:
    name: Unsupported K8s versions
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        kubernetes: [v1.30.14,v1.29.14,v1.28.15,v1.27.16,v1.26.15]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@master
      - name: Test Action
        uses: ./
        with:
          minikube version: v1.38.1
          kubernetes version: ${{ matrix.kubernetes }}
          github token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate Minikube
        run: minikube status | grep Running
      - name: Validate Cluster
        run: kubectl get nodes
      - name: Validate default driver
        run: 'cat $MINIKUBE_HOME/.minikube/machines/minikube/config.json | jq ".DriverName" | grep none'
  # Validates the --force workaround for K8s versions not in Minikube's
  # built-in supported list. When the requested version is newer (or older)
  # than what Minikube ships with, the action should:
  # 1. Detect the version is not in `minikube config defaults kubernetes-version`
  # 2. Verify the version exists on GitHub (kubernetes/kubernetes releases)
  # 3. Warn the user and add --force to `minikube start` to bypass Minikube's
  #    internal unauthenticated GitHub API check (which causes rate-limit errors)
  # See https://github.com/manusa/actions-setup-minikube/issues/141
  unsupported-with-force:
    name: Unsupported K8s version (--force)
    runs-on: ubuntu-latest
    env:
      MINIKUBE_VERSION: v1.35.0
      KUBERNETES_VERSION: v1.33.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@master
      - name: Verify K8s version is not in Minikube supported list
        run: |
          curl -sL "https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-amd64" -o /tmp/minikube
          chmod +x /tmp/minikube
          echo "Minikube supported versions (first 10):"
          /tmp/minikube config defaults kubernetes-version | head -10
          if /tmp/minikube config defaults kubernetes-version | grep -q "^\\* ${KUBERNETES_VERSION}$"; then
            echo "::error::${KUBERNETES_VERSION} is in Minikube's supported list, pick a different version for this test"
            exit 1
          fi
          echo "${KUBERNETES_VERSION} is NOT in Minikube's supported list (as expected)"
      - name: Test Action
        id: setup-minikube
        uses: ./
        with:
          minikube version: ${{ env.MINIKUBE_VERSION }}
          kubernetes version: ${{ env.KUBERNETES_VERSION }}
          github token: ${{ secrets.GITHUB_TOKEN }}
          driver: docker
      - name: Validate --force was used
        run: |
          if [ "${{ steps.setup-minikube.outputs.force }}" != "true" ]; then
            echo "::error::Expected force output to be 'true' but got '${{ steps.setup-minikube.outputs.force }}'"
            exit 1
          fi
      - name: Validate Minikube
        run: minikube status | grep Running
      - name: Validate Cluster
        run: kubectl get nodes
      - name: Validate Kubernetes version
        run: kubectl version -o json | jq -r '.serverVersion.gitVersion' | grep "${{ env.KUBERNETES_VERSION }}"
